<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="טנק מלא — יומן התדלוקים החכם שלך. צריכה, עלויות ומגמות." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="טנק מלא" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>טנק מלא</title>
    <script>
      // Stamp the saved theme and accent before first paint so the app never
      // flashes the wrong palette. "system" stamps nothing, which lets the
      // prefers-color-scheme media query in index.css take over.
      (function () {
        try {
          var theme = localStorage.getItem("tm.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
          var accent = localStorage.getItem("tm.accent");
          if (accent) {
            var a = JSON.parse(accent);
            var s = document.documentElement.style;
            if (a.light) s.setProperty("--accent-l", a.light);
            if (a.dark) s.setProperty("--accent-d", a.dark);
            if (a.softLight) s.setProperty("--accent-soft-l", a.softLight);
            if (a.softDark) s.setProperty("--accent-soft-d", a.softDark);
            if (a.contrastLight) s.setProperty("--accent-contrast-l", a.contrastLight);
            if (a.contrastDark) s.setProperty("--accent-contrast-d", a.contrastDark);
          }
        } catch (e) {
          /* private mode / storage disabled — fall back to defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
