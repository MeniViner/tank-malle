name: Admin operations

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read metrics without publishing a snapshot
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tank-malle-admin-operations
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'MeniViner/tank-malle' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish aggregate monitoring snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/collectAdminOperations.mjs --spark ${{ inputs.dry_run && '--dry-run' || '' }}
