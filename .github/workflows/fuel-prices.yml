name: Fuel price

# The regulated 95 price and confirmed upcoming notices, refreshed every two hours.
# A published change can arrive within a month. GitHub schedules may be delayed;
# the browser also checks public notices while the app is in use.
#
# ONE-TIME SETUP
#   1. Firebase console → Project settings → Service accounts → Generate new
#      private key. A JSON file downloads.
#   2. GitHub → repository → Settings → Secrets and variables → Actions →
#      New repository secret, named FIREBASE_SERVICE_ACCOUNT, whose value is
#      the whole contents of that JSON file.
#   3. Actions → Fuel price → Run workflow, to prove it end to end.
#
# The key is a Firestore-writing credential: keep it in the secret only, never
# in the repo, and rotate it in the console if it is ever exposed.

on:
  schedule:
    # UTC; actual price activation is derived from the notice in Asia/Jerusalem.
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: fuel-price
  cancel-in-progress: false

jobs:
  update:
    name: Read gov.il and write appConfig/fuelPrices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install outside the app package, so npm does not also install the
      # browser tests, Firebase CLI and frontend toolchain.
      - name: Install the Admin SDK
        run: |
          runtime_dir="$RUNNER_TEMP/tank-fuel"
          mkdir -p "$runtime_dir/scripts" "$runtime_dir/src/lib/prices"
          cp scripts/updateFuelPrices.mjs "$runtime_dir/scripts/"
          cp src/lib/prices/publicSource.ts "$runtime_dir/src/lib/prices/"
          npm install --prefix "$runtime_dir" --no-save --no-audit --no-fund firebase-admin@14

      - name: Update the regulated price
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node "$RUNNER_TEMP/tank-fuel/scripts/updateFuelPrices.mjs"
