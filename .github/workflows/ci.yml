name: CI

# Runs on every pull request and on pushes to the implementation branch.
# Nothing here deploys, and nothing touches a real Firebase project: the
# emulators run against the reserved `demo-` project id, which they special-case
# to refuse contact with any Google service.
on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps Playwright and the emulators from being chatty about interactivity.
  CI: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: types, lint, unit tests, and both builds.
  # ---------------------------------------------------------------------------
  verify:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        # oxlint exits non-zero on errors. Warnings are reported but do not
        # fail the build; the count is asserted separately below so a
        # regression is caught without turning every warning into a blocker.
        run: npm run lint

      - name: Lint warning budget
        # The baseline on main is 20. A branch that adds warnings should say so
        # deliberately rather than letting them accumulate unnoticed.
        #
        # Counted from oxlint's JSON output, not from grepping the human
        # report: on the CI runner oxlint prints GitHub-annotation lines
        # ("##[warning]src/...") and the old grep for "^src/" counted zero
        # every time, so the budget was never enforced.
        run: |
          count=$(npx oxlint --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.diagnostics.filter(d=>d.severity==="warning").length)})')
          echo "lint warnings: $count (budget 20)"
          if [ "$count" -gt 20 ]; then
            echo "::error::lint warnings regressed: $count > 20"
            npm run lint 2>&1 || true
            exit 1
          fi

      - name: Unit tests
        # The seven workbook tests that need the real attached file are skipped
        # here; the synthetic fixtures cover the same code paths.
        run: npm test

      - name: Production build
        run: npm run build

      - name: Functions install and build
        # Functions are NOT deployed by this workflow. They are compiled so a
        # change that breaks them is caught before anyone tries.
        run: |
          npm ci --prefix functions
          npm run build --prefix functions

      - name: Import fixtures still match their generators
        # A fixture edited by hand instead of regenerated would silently drift
        # from the script that documents what it tests.
        #
        # Checked by REGENERATING and re-running the suites against the result,
        # not by comparing bytes: DEFLATE output is not stable across zlib
        # versions, so a byte comparison would fail on any runner whose zlib
        # differs from the committer's — a false alarm about a real property
        # nobody actually needs. The CSV fixture is plain text and IS compared.
        run: |
          node scripts/makeImportFixtures.mjs
          node scripts/makeXlsxFixtures.mjs
          if ! git diff --quiet -- src/lib/import/__fixtures__/legacy-fuel-tracker.csv; then
            echo "::error::the CSV fixture differs from its generator — re-run the script and commit"
            git diff -- src/lib/import/__fixtures__/legacy-fuel-tracker.csv
            exit 1
          fi
          npx vitest run src/lib/import src/lib/csv.test.ts
          git checkout -- src/lib/import/__fixtures__

  # ---------------------------------------------------------------------------
  # Firestore Rules, against the emulator.
  # ---------------------------------------------------------------------------
  rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # firebase-tools refuses anything older than 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Cache the emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Rules tests
        run: npm run test:rules

  # ---------------------------------------------------------------------------
  # End-to-end, in a real browser, against the emulators.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Cache the emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # --with-deps every time: the cache holds the browser, not the system
        # libraries it links against, and a cache hit with missing libs fails
        # in a way that looks like a test bug.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
